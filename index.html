<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FDFBF7',

              100: '#F9F1DC',

            'fade-in': 'fadeIn 0.3s ease-out forwards',

          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },

            fadeIn: {

              '100%': { opacity: '1' },

  <style>
    /* Custom Styles */
    body {
      background-color: #FDFBF7;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Mushaf Frame Styling */
    .mushaf-frame {
      border: 8px solid #F9F1DC;
      outline: 2px solid #D4AF37;
      outline-offset: -6px;
      background-color: #ffffff;
      box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1), 0 10px 30px rgba(0,0,0,0.05);
    }

    /* Word Tokens */
    .word-token {
      display: inline-block;
      margin: 0 2px;
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .word-token:hover {
      background-color: rgba(212, 175, 55, 0.1);
    }

    /* Speaking Highlight - Glowing Effect */
    .word-token.speaking {
      background-color: rgba(212, 175, 55, 0.25) !important;
      color: #8C6C11 !important;
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
      border-radius: 6px;
      z-index: 10;
    }

    /* Filter Highlights */
    .word-token.highlight-filter {
      background-color: #F9F1DC;
      border-bottom: 2px solid #D4AF37;
    }
    .word-token.dimmed {
      opacity: 0.25;
      filter: grayscale(50%);
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #D4AF37;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #e5e7eb;
      border-radius: 2px;
    }
    .slider-progress {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      transform: translateY(-50%);
      background: #D4AF37;
      border-radius: 2px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body class="font-cairo text-ink-main pb-40">

  <div class="max-w-7xl mx-auto px-4 pt-8">
    
    <!-- Header -->

      <h1 class="font-quran text-3xl md:text-4xl text-gold-700">سُورَةُ الفَاتِحَةِ</h1>
      <p class="text-ink-muted text-sm mt-2">المصحف المعلم التفاعلي لأحكام التجويد</p>
    </header>

    <!-- Filters Section -->

      <div class="flex flex-wrap gap-2 pb-2 justify-center" id="filtersContainer">

      </div>

      <!-- Rule Explanation Card (Appears when filter selected) -->

        <div class="absolute right-0 top-0 bottom-0 w-1.5 bg-gold-500"></div>
        <h3 id="ruleBriefTitle" class="font-bold text-gold-700 mb-1 text-base"></h3>
        <p id="ruleBriefDesc" class="text-ink-muted text-sm leading-relaxed"></p>
      </div>
    </section>

    <!-- Main Layout: Grid (Mushaf on right, Panel on left) -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start animate-slide-up" style="animation-delay: 0.2s;">
      
      <!-- Quran Mushaf Frame (Takes more space) -->
      <div class="lg:col-span-8 mushaf-frame rounded-xl p-6 md:p-10 relative">
        <!-- Decoration -->
        <div class="absolute top-2 right-2 text-gold-300/40"><i class="ph-fill ph-moon-stars text-2xl"></i></div>
        <div class="absolute top-2 left-2 text-gold-300/40"><i class="ph-fill ph-moon-stars text-2xl"></i></div>
        
        <!-- Quran Text Container -->
        <div id="quranContainer" class="text-center leading-[2.5] font-quran text-2xl md:text-3xl text-ink-main select-none">
          <!-- Words inserted via JS -->
        </div>
      </div>

      <!-- Details Side Panel (Empty space utilized for rules) -->
      <aside class="lg:col-span-4 sticky top-6">
        <div id="detailsSidebar" class="bg-surface rounded-xl shadow-lg border border-gold-200 p-6 min-h-[300px] flex flex-col transition-all duration-300">
          
          <!-- Default State (Before clicking a word) -->
          <div id="defaultState" class="flex-grow flex flex-col items-center justify-center text-center text-ink-muted opacity-100 transition-opacity">
            <div class="w-16 h-16 bg-gold-50 rounded-full flex items-center justify-center mb-4 text-gold-400">

            </div>
            <h3 class="font-bold text-lg mb-2 text-ink-main">تفاصيل الأحكام التجويدية</h3>
            <p class="text-sm">اضغط على أي كلمة من السورة في الإطار المقابل لعرض أحكامها التجويدية وتفاصيلها هنا.</p>
          </div>

          <div id="activeState" class="hidden flex-col h-full opacity-0 transition-opacity duration-300">
            <div class="border-b border-gold-100 pb-4 mb-4">
              <span id="panelTag" class="text-xs font-bold px-3 py-1 bg-gold-100 text-gold-700 rounded-full mb-3 inline-block"></span>
              <h2 id="panelWordText" class="font-quran text-4xl text-gold-700 text-center mt-2 mb-2 block"></h2>
            </div>
            
            <div id="panelRulesList" class="flex-grow overflow-y-auto max-h-[40vh] custom-scroll space-y-3 mb-6">
              <!-- Rules injected here -->
            </div>

            <!-- Play Word Button -->

            </button>
          </div>

        </div>
      </aside>

    </main>

      { id: 27, ayah: 7, text: "عَلَيۡهِمۡ", start: 49.3, end: 50.8, rules: [{ name: "إظهار شفوي", cat: "idhar_shafawi", text: "إظهار الميم الساكنة." }] },
      { id: 28, ayah: 7, text: "وَلَا", start: 50.8, end: 52.0, rules: [{ name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف حركتين وصلاً." }] },
      { id: 29, ayah: 7, text: "ٱلضَّآلِّينَ", start: 52.0, end: 58.5, rules: [{ name: "لام شمسية", cat: "lam_shamsiya", text: "إدغام لام التعريف في الضاد." }, { name: "تفخيم الضاد", cat: "tafkheem", text: "تفخيم الضاد المشددة واستطالتها." }, { name: "مد لازم", cat: "madd_lazim", text: "مد 6 حركات لزوماً." }, { name: "مد عارض للسكون", cat: "madd_ared", text: "مد الياء عند الوقف على النون." }] },
      { isAyahEnd: true, num: 7 }
    ];

    // --- DOM Elements ---
    const quranContainer = document.getElementById('quranContainer');
    const filtersContainer = document.getElementById('filtersContainer');
    const audio = document.getElementById('audioPlayer');
    const mainPlayBtn = document.getElementById('mainPlayBtn');
    const mainPlayIcon = document.getElementById('mainPlayIcon');
    const progressSlider = document.getElementById('audioProgress');
    const progressActive = document.getElementById('progressActive');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const reciterSelect = document.getElementById('reciterSelect');

    let currentReciter = 'afasy';
    let currentFilter = 'all';
    let activeWordId = null;
    let isDragging = false;
    let animationFrameId = null;

    // --- Initialization ---
    function init() {
      renderQuran();
      renderFilters();
      setupAudio();
    }

    // --- Render Quran Text (Uthmani Style Setup) ---
    function renderQuran() {
      quranContainer.innerHTML = '';
      
      // حاوية للبسملة لوحدها كسطر علوي مع الحفاظ عليها كآية رقم 1
      const bismillahDiv = document.createElement('div');
      bismillahDiv.className = 'text-center mb-4 pb-4 border-b border-gold-300/30';
      
      // حاوية لباقي السورة
      const restOfSurahDiv = document.createElement('div');
      restOfSurahDiv.className = 'text-justify lg:text-center'; // Text align justify/center

      quranData.forEach(item => {
        // إذا كانت ضمن الآية الأولى (البسملة) تضاف في الحاوية العلوية
        const targetContainer = item.ayah === 1 ? bismillahDiv : restOfSurahDiv;

        if (item.isAyahEnd) {
          const marker = document.createElement('span');
          marker.className = 'inline-flex items-center justify-center w-8 h-8 mx-1 text-gold-600 font-quran text-lg md:text-xl align-middle';
          marker.innerHTML = `﴿${item.num}﴾`;
          targetContainer.appendChild(marker);
        } else {
          const span = document.createElement('span');
          span.className = 'word-token';
          span.id = `word-${item.id}`;
          span.dataset.id = item.id;
          span.dataset.categories = item.rules.map(r => r.cat).join(' ');
          span.textContent = item.text;
          
          span.addEventListener('click', () => openWordDetails(item));
          targetContainer.appendChild(span);
        }
      });
      
      quranContainer.appendChild(bismillahDiv);
      quranContainer.appendChild(restOfSurahDiv);
    }

    // --- Render Chips Filters ---
    function renderFilters() {
      filtersContainer.innerHTML = `<button data-cat="all" onclick="applyFilter('all', this)" class="filter-chip bg-gold-600 text-white px-4 py-1.5 rounded-full text-xs md:text-sm font-bold flex-shrink-0 transition-all shadow-md shadow-gold-500/20">الكل</button>`;
      
      Object.keys(RULE_INFO).forEach(key => {
        const title = RULE_INFO[key].title.split(' (')[0];
        const btn = document.createElement('button');
        btn.className = 'filter-chip bg-surface border border-gold-200 text-ink-muted hover:bg-gold-50 hover:border-gold-300 px-3 py-1.5 rounded-full text-xs md:text-sm font-semibold flex-shrink-0 transition-all';
        btn.textContent = title;
        btn.dataset.cat = key;
        btn.onclick = () => applyFilter(key, btn);
        filtersContainer.appendChild(btn);
      });
    }

    function applyFilter(category, btnElement) {
      currentFilter = category;
      document.querySelectorAll('.filter-chip').forEach(b => {
        b.classList.remove('bg-gold-600', 'text-white', 'shadow-md', 'shadow-gold-500/20');
        b.classList.add('bg-surface', 'border-gold-200', 'text-ink-muted');
      });
      
      btnElement.classList.remove('bg-surface', 'border-gold-200', 'text-ink-muted');
      btnElement.classList.add('bg-gold-600', 'text-white', 'shadow-md', 'shadow-gold-500/20');

      const briefCard = document.getElementById('ruleBriefCard');
      const allWords = document.querySelectorAll('.word-token');

      if (category === 'all') {
        briefCard.classList.add('hidden');
        allWords.forEach(w => w.classList.remove('highlight-filter', 'dimmed'));
        return;
      }

      if (RULE_INFO[category]) {
        document.getElementById('ruleBriefTitle').textContent = RULE_INFO[category].title;
        document.getElementById('ruleBriefDesc').textContent = RULE_INFO[category].desc;
        briefCard.classList.remove('hidden');
      }

      allWords.forEach(w => {
        const cats = w.dataset.categories.split(' ');
        if (cats.includes(category)) {
          w.classList.add('highlight-filter');
          w.classList.remove('dimmed');
        } else {
          w.classList.remove('highlight-filter');
          w.classList.add('dimmed');
        }
      });
    }

    // --- Sidebar Panel Logic (Replaces Modal) ---
    const defaultState = document.getElementById('defaultState');
    const activeState = document.getElementById('activeState');
    
    function openWordDetails(item) {
      // Hide default, show active
      defaultState.classList.add('hidden');
      defaultState.classList.remove('flex');
      activeState.classList.remove('hidden');
      activeState.classList.add('flex');
      
      // Fade in effect
      setTimeout(() => {
        activeState.classList.remove('opacity-0');
        activeState.classList.add('opacity-100');
      }, 50);

      document.getElementById('panelWordText').textContent = item.text;
      document.getElementById('panelTag').textContent = `الآية ${item.ayah}`;
      
      const rulesList = document.getElementById('panelRulesList');
      rulesList.innerHTML = '';
      
      if (item.rules && item.rules.length > 0) {
        item.rules.forEach(rule => {
          rulesList.innerHTML += `
            <div class="bg-gold-50/40 border border-gold-100 rounded-lg p-3 border-r-4 border-r-gold-500">
              <div class="font-bold text-gold-700 text-sm mb-1">${rule.name}</div>
              <div class="text-ink-main text-sm leading-relaxed">${rule.text}</div>
            </div>
          `;
        });
      } else {
        rulesList.innerHTML = `<div class="text-ink-muted text-sm text-center py-6 bg-gray-50 rounded-lg border border-dashed border-gray-200">لا توجد أحكام تجويدية خاصة مستخرجة لهذه الكلمة.</div>`;
      }

      const playBtn = document.getElementById('playWordBtn');
      playBtn.onclick = () => {
        const offset = RECITERS_CONFIG[currentReciter].timingOffset || 0;
        audio.currentTime = item.start + offset;
        if(audio.paused) togglePlay();
      };
    }

    // --- Audio & Synchronization ---
    function setupAudio() {
      audio.src = RECITERS_CONFIG[currentReciter].url;
      
      mainPlayBtn.addEventListener('click', togglePlay);
      
      reciterSelect.addEventListener('change', (e) => {
        currentReciter = e.target.value;
        const wasPlaying = !audio.paused;
        audio.src = RECITERS_CONFIG[currentReciter].url;
        if(wasPlaying) audio.play();
      });

      audio.addEventListener('loadedmetadata', () => {
        progressSlider.max = audio.duration;
        totalTimeDisplay.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('play', () => {
        mainPlayIcon.classList.replace('ph-play', 'ph-pause');
        syncLoop();
      });
      
      audio.addEventListener('pause', () => {
        mainPlayIcon.classList.replace('ph-pause', 'ph-play');
        cancelAnimationFrame(animationFrameId);
      });

      audio.addEventListener('ended', () => {
        mainPlayIcon.classList.replace('ph-pause', 'ph-play');
        progressSlider.value = 0;
        updateSliderVisuals();
        clearHighlight();
        cancelAnimationFrame(animationFrameId);
      });

      progressSlider.addEventListener('input', () => {
        isDragging = true;
        updateSliderVisuals();
        currentTimeDisplay.textContent = formatTime(progressSlider.value);
      });
      
      progressSlider.addEventListener('change', () => {
        audio.currentTime = progressSlider.value;
        isDragging = false;
        forceSync();
      });
    }

    function togglePlay() {
      if (audio.paused) audio.play();
      else audio.pause();
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateSliderVisuals() {
      const val = (progressSlider.value / progressSlider.max) * 100;
      progressActive.style.width = `${val}%`;
    }

    function syncLoop() {
      if (!isDragging) {
        progressSlider.value = audio.currentTime;
        updateSliderVisuals();
        currentTimeDisplay.textContent = formatTime(audio.currentTime);
        forceSync();
      }
      animationFrameId = requestAnimationFrame(syncLoop);
    }

    function forceSync() {
      const current = audio.currentTime;
      const offset = RECITERS_CONFIG[currentReciter].timingOffset || 0;
      
      // الوقت المعدل لحساب الاستعاذة المخفية
      const adjustedTime = current - offset;

      // لن يتم تظليل أي شيء إلا إذا وصل الوقت المعدل إلى توقيت الآية الأولى (البسملة = 0.1)
      const currentWord = quranData.find(item => !item.isAyahEnd && adjustedTime >= item.start && adjustedTime < item.end);

      if (currentWord) {
        if (activeWordId !== currentWord.id) {
          clearHighlight();
          activeWordId = currentWord.id;
          const elem = document.getElementById(`word-${currentWord.id}`);
          if (elem) {
            elem.classList.add('speaking');
            
            // Auto scroll on mobile if word is out of view (optional enhancement)
            const rect = elem.getBoundingClientRect();
            if(rect.top < 100 || rect.bottom > window.innerHeight - 200) {
              elem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }
        }
      } else {
        clearHighlight();
        activeWordId = null;
      }
    }

    function clearHighlight() {
      const activeEl = document.querySelector('.word-token.speaking');
      if (activeEl) activeEl.classList.remove('speaking');
    }

    init();

  </script>
</body>
</html>
