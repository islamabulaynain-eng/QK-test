    tailwind.config = {
      theme: {
        extend: {
          colors: {

              100: '#F9F1DC',

          keyframes: {
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },

            fadeIn: {

  <style>
    /* Custom Styles */
    body {
      background-color: #FDFBF7;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4af37' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    /* Word Tokens */
    .word-token {
      display: inline-block;
      margin: 0 4px;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .word-token:hover {
      background-color: rgba(212, 175, 55, 0.1);
    }

    /* Speaking Highlight - Glowing Effect */
    .word-token.speaking {
      background-color: rgba(212, 175, 55, 0.25) !important;
      color: #8C6C11 !important;
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), inset 0 0 8px rgba(212, 175, 55, 0.2);
      border-radius: 8px;
      z-index: 10;
    }

    /* Filter Highlights */
    .word-token.highlight-filter {
      background-color: #F9F1DC;
      border-bottom: 2px solid #D4AF37;
    }
    .word-token.dimmed {
      opacity: 0.25;
      filter: grayscale(50%);
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #D4AF37;
      cursor: pointer;
      margin-top: -5px;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #e5e7eb;
      border-radius: 2px;
    }
    .slider-progress {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      transform: translateY(-50%);
      background: #D4AF37;
      border-radius: 2px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

      { id: 20, ayah: 6, text: "ٱلۡمُسۡتَقِيمَ", start: 36.3, end: 40.0, rules: [{ name: "لام قمرية", cat: "lam_qamariya", text: "إظهار اللام القمرية الساكنة." }, { name: "همس", cat: "hamas", text: "همس السين والتاء." }, { name: "مد عارض للسكون", cat: "madd_ared", text: "مد عارض للسكون عند الوقف." }] },
      { isAyahEnd: true, num: 6 },
      { id: 21, ayah: 7, text: "صِرَٰطَ", start: 40.5, end: 41.8, rules: [{ name: "تفخيم", cat: "tafkheem", text: "تفخيم الصاد والراء والطاء." }, { name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف الخنجرية حركتين." }] },
      { id: 22, ayah: 7, text: "ٱلَّذِينَ", start: 41.8, end: 43.1, rules: [{ name: "مد طبيعي", cat: "madd_tabiee", text: "مد الياء حركتين وصلاً." }] },
      { id: 23, ayah: 7, text: "أَنۡعَمۡتَ", start: 43.1, end: 44.8, rules: [{ name: "إظهار حلقي", cat: "idhar_halqi", text: "إظهار النون الساكنة عند العين بدون غنة." }, { name: "إظهار شفوي", cat: "idhar_shafawi", text: "إظهار الميم الساكنة عند التاء." }] },
      { id: 24, ayah: 7, text: "عَلَيۡهِمۡ", start: 44.8, end: 46.1, rules: [{ name: "إظهار شفوي", cat: "idhar_shafawi", text: "إظهار الميم الساكنة عند الغين (عَلَيْهِمْ غَيْرِ)." }] },
      { id: 25, ayah: 7, text: "غَيۡرِ", start: 46.1, end: 47.4, rules: [{ name: "تفخيم الغين", cat: "tafkheem", text: "تفخيم الغين لكونها من أحرف الاستعلاء." }, { name: "ترقيق الراء", cat: "tarqeeq", text: "ترقيق الراء لكسرها." }] },
      { id: 26, ayah: 7, text: "ٱلۡمَغۡضُوبِ", start: 47.4, end: 49.3, rules: [{ name: "لام قمرية", cat: "lam_qamariya", text: "إظهار اللام القمرية قبل الميم." }, { name: "تفخيم", cat: "tafkheem", text: "تفخيم الغين والضاد." }, { name: "مد طبيعي", cat: "madd_tabiee", text: "مد الواو حركتين وصلاً." }] },
      { id: 27, ayah: 7, text: "عَلَيۡهِمۡ", start: 49.3, end: 50.8, rules: [{ name: "إظهار شفوي شديد", cat: "idhar_shafawi", text: "إظهار الميم الساكنة عند الواو وبيانها بوضوح." }] },
      { id: 28, ayah: 7, text: "وَلَا", start: 50.8, end: 52.0, rules: [{ name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف حركتين وصلاً." }] },
      { id: 29, ayah: 7, text: "ٱلضَّآلِّينَ", start: 52.0, end: 58.5, rules: [{ name: "لام شمسية", cat: "lam_shamsiya", text: "إدغام لام التعريف في الضاد." }, { name: "تفخيم الضاد", cat: "tafkheem", text: "تفخيم الضاد المشددة واستطالتها." }, { name: "مد لازم كلمي مثقل", cat: "madd_lazim", text: "مد 6 حركات لزوماً لمجيء اللام المشددة بعد حرف المد." }, { name: "مد عارض للسكون", cat: "madd_ared", text: "مد الياء عند الوقف على النون." }] },
      { isAyahEnd: true, num: 7 }
    ];

    // --- DOM Elements ---
    const quranContainer = document.getElementById('quranContainer');
    const filtersContainer = document.getElementById('filtersContainer');
    const audio = document.getElementById('audioPlayer');
    const mainPlayBtn = document.getElementById('mainPlayBtn');
    const mainPlayIcon = document.getElementById('mainPlayIcon');
    const progressSlider = document.getElementById('audioProgress');
    const progressActive = document.getElementById('progressActive');
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const reciterSelect = document.getElementById('reciterSelect');

    let currentReciter = 'afasy';
    let currentFilter = 'all';
    let activeWordId = null;
    let isDragging = false;
    let animationFrameId = null;

    // --- Initialization ---
    function init() {
      renderQuran();
      renderFilters();
      setupAudio();
    }

    // --- Render Quran Text ---
    function renderQuran() {
      quranContainer.innerHTML = '';
      const reciterConfig = RECITERS_CONFIG[currentReciter];

      quranData.forEach(item => {
        // إخفاء الاستعاذة إذا كان القارئ لا يقرأها
        if (item.isIstiada && !reciterConfig.hasIstiada) return;

        if (item.isAyahEnd) {
          const marker = document.createElement('span');
          marker.className = 'inline-flex items-center justify-center w-10 h-10 mx-2 text-gold-600 font-quran text-2xl align-middle';
          marker.innerHTML = `﴿${item.num}﴾`;
          quranContainer.appendChild(marker);
        } else {
          const span = document.createElement('span');
          span.className = 'word-token';
          span.id = `word-${item.id}`;
          span.dataset.id = item.id;
          span.dataset.categories = item.rules.map(r => r.cat).join(' ');
          span.textContent = item.text;
          
          span.addEventListener('click', () => openWordDetails(item));
          quranContainer.appendChild(span);
        }
      });
    }

    // --- Render Chips Filters ---
    function renderFilters() {
      filtersContainer.innerHTML = `<button data-cat="all" onclick="applyFilter('all', this)" class="filter-chip bg-gold-600 text-white px-4 py-1.5 rounded-full text-sm font-bold flex-shrink-0 transition-all shadow-md shadow-gold-500/20">الكل</button>`;
      
      Object.keys(RULE_INFO).forEach(key => {
        const title = RULE_INFO[key].title.split(' (')[0];
        const btn = document.createElement('button');
        btn.className = 'filter-chip bg-surface border border-gold-200 text-ink-muted hover:bg-gold-50 hover:border-gold-300 px-4 py-1.5 rounded-full text-sm font-semibold flex-shrink-0 transition-all';
        btn.textContent = title;
        btn.dataset.cat = key;
        btn.onclick = () => applyFilter(key, btn);
        filtersContainer.appendChild(btn);
      });
    }

    function applyFilter(category, btnElement) {
      currentFilter = category;
      document.querySelectorAll('.filter-chip').forEach(b => {
        b.classList.remove('bg-gold-600', 'text-white', 'shadow-md', 'shadow-gold-500/20');
        b.classList.add('bg-surface', 'border-gold-200', 'text-ink-muted');
      });
      
      btnElement.classList.remove('bg-surface', 'border-gold-200', 'text-ink-muted');
      btnElement.classList.add('bg-gold-600', 'text-white', 'shadow-md', 'shadow-gold-500/20');

      const briefCard = document.getElementById('ruleBriefCard');
      const allWords = document.querySelectorAll('.word-token');

      if (category === 'all') {
        briefCard.classList.add('hidden');
        allWords.forEach(w => w.classList.remove('highlight-filter', 'dimmed'));
        return;
      }

      if (RULE_INFO[category]) {
        document.getElementById('ruleBriefTitle').textContent = RULE_INFO[category].title;
        document.getElementById('ruleBriefDesc').textContent = RULE_INFO[category].desc;
        briefCard.classList.remove('hidden');
      }

      allWords.forEach(w => {
        const cats = w.dataset.categories.split(' ');
        if (cats.includes(category)) {
          w.classList.add('highlight-filter');
          w.classList.remove('dimmed');
        } else {
          w.classList.remove('highlight-filter');
          w.classList.add('dimmed');
        }
      });
    }

    // --- Modal Logic ---
    const modal = document.getElementById('detailsModal');
    const card = document.getElementById('detailsCard');
    
    function openWordDetails(item) {
      document.getElementById('modalWordText').textContent = item.text;
      document.getElementById('modalTag').textContent = item.isIstiada ? 'الاستعاذة' : `الآية ${item.ayah}`;
      
      const rulesList = document.getElementById('modalRulesList');
      rulesList.innerHTML = '';
      
      if (item.rules && item.rules.length > 0) {
        item.rules.forEach(rule => {
          rulesList.innerHTML += `
            <div class="bg-gold-50/50 border border-gold-100 rounded-lg p-3 border-r-4 border-r-gold-500">
              <div class="font-bold text-gold-700 text-sm mb-1">${rule.name}</div>
              <div class="text-ink-main text-sm leading-relaxed">${rule.text}</div>
            </div>
          `;
        });
      } else {
        rulesList.innerHTML = `<div class="text-ink-muted text-sm text-center py-4">لا توجد أحكام تجويدية خاصة هنا.</div>`;
      }

      const playBtn = document.getElementById('playWordBtn');
      playBtn.onclick = () => {
        const offset = RECITERS_CONFIG[currentReciter].timingOffset || 0;
        audio.currentTime = item.start + offset;
        if(audio.paused) togglePlay();
      };

      if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        void modal.offsetWidth; // trigger reflow
        modal.classList.add('opacity-100');
        card.classList.remove('translate-y-4');
        card.classList.add('translate-y-0');
      }
    }

    function closeDetails() {
      modal.classList.remove('opacity-100');
      card.classList.remove('translate-y-0');
      card.classList.add('translate-y-4');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // --- Audio & Synchronization ---
    function setupAudio() {
      audio.src = RECITERS_CONFIG[currentReciter].url;
      
      mainPlayBtn.addEventListener('click', togglePlay);
      
      reciterSelect.addEventListener('change', (e) => {
        currentReciter = e.target.value;
        renderQuran();
        
        // Reapply active filter correctly
        const activeFilterBtn = document.querySelector(`.filter-chip[data-cat="${currentFilter}"]`);
        if (activeFilterBtn) applyFilter(currentFilter, activeFilterBtn);

        const wasPlaying = !audio.paused;
        audio.src = RECITERS_CONFIG[currentReciter].url;
        if(wasPlaying) audio.play();
      });

      audio.addEventListener('loadedmetadata', () => {
        progressSlider.max = audio.duration;
        totalTimeDisplay.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('play', () => {
        mainPlayIcon.classList.replace('ph-play', 'ph-pause');
        syncLoop();
      });
      
      audio.addEventListener('pause', () => {
        mainPlayIcon.classList.replace('ph-pause', 'ph-play');
        cancelAnimationFrame(animationFrameId);
      });

      audio.addEventListener('ended', () => {
        mainPlayIcon.classList.replace('ph-pause', 'ph-play');
        progressSlider.value = 0;
        updateSliderVisuals();
        clearHighlight();
        cancelAnimationFrame(animationFrameId);
      });

      progressSlider.addEventListener('input', () => {
        isDragging = true;
        updateSliderVisuals();
        currentTimeDisplay.textContent = formatTime(progressSlider.value);
      });
      
      progressSlider.addEventListener('change', () => {
        audio.currentTime = progressSlider.value;
        isDragging = false;
        forceSync();
      });
    }

    function togglePlay() {
      if (audio.paused) audio.play();
      else audio.pause();
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateSliderVisuals() {
      const val = (progressSlider.value / progressSlider.max) * 100;
      progressActive.style.width = `${val}%`;
    }

    function syncLoop() {
      if (!isDragging) {
        progressSlider.value = audio.currentTime;
        updateSliderVisuals();
        currentTimeDisplay.textContent = formatTime(audio.currentTime);
        forceSync();
      }
      animationFrameId = requestAnimationFrame(syncLoop);
    }

    function forceSync() {
      const current = audio.currentTime;
      const offset = RECITERS_CONFIG[currentReciter].timingOffset || 0;
      // Adjusted time accounts for the offset so Bismillah remains at start: 0.1
      const adjustedTime = current - offset;

      const currentWord = quranData.find(item => !item.isAyahEnd && adjustedTime >= item.start && adjustedTime < item.end);

      if (currentWord) {
        // Skip highlighting Isti'adha if reciter doesn't have it
        if (currentWord.isIstiada && !RECITERS_CONFIG[currentReciter].hasIstiada) return;

        if (activeWordId !== currentWord.id) {
          clearHighlight();
          activeWordId = currentWord.id;
          const elem = document.getElementById(`word-${currentWord.id}`);
          if (elem) elem.classList.add('speaking');
        }
      } else {
        clearHighlight();
        activeWordId = null;
      }
    }

    function clearHighlight() {
      const activeEl = document.querySelector('.word-token.speaking');
      if (activeEl) activeEl.classList.remove('speaking');
    }

    init();

  </script>
</body>
