<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصحف المعلم - أحكام التجويد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #c5a059;
      --deep-gold: #85611f;
      --light-gold: #fcf9f2;
      --card-bg: #ffffff;
      --text-dark: #22201c;
      --text-muted: #615a4f;
      --border-color: #e5dbc7;
      --glow-color: rgba(197, 160, 89, 0.4);
      --speaking-color: #92341d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--light-gold);
      color: var(--text-dark);
      padding: 24px 14px 120px; /* مساحة للشريط السفلي */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; }
    header h1 { font-family: 'Amiri', serif; font-size: 2.2rem; color: var(--deep-gold); }
    header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 5px; }

    /* أدوات التحكم (القارئ والتصفية) */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 4px 14px rgba(133, 97, 31, 0.05);
    }
    
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    select.reciter-select {
      background: #faf7f0;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      color: var(--deep-gold);
      cursor: pointer;
      outline: none;
      width: 100%;
      max-width: 300px;
    }

    .filter-buttons-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-rule {
      background: #faf7f0; border: 1px solid var(--border-color);
      padding: 6px 14px; border-radius: 20px; font-family: 'Cairo', sans-serif;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-rule:hover { background: #f1ebd8; border-color: var(--primary-gold); }
    .btn-rule.active { background: var(--deep-gold); color: #fff; border-color: var(--deep-gold); }

    /* شرح الحكم */
    .rule-brief-card {
      display: none; margin-top: 14px; background: #fffcf4;
      border-right: 4px solid var(--primary-gold); padding: 12px 16px; border-radius: 8px;
    }
    .rule-brief-card.active { display: block; animation: fadeIn 0.3s ease; }
    .rule-brief-title { font-weight: 800; color: var(--deep-gold); margin-bottom: 4px; }
    .rule-brief-desc { font-size: 0.9rem; line-height: 1.6; }

    /* المصحف */
    .mushaf-card {
      background: #fffefb; border: 2px solid var(--primary-gold);
      border-radius: 20px; padding: 36px 28px;
      box-shadow: 0 10px 30px rgba(143, 109, 40, 0.1); position: relative;
    }
    .surah-header-badge {
      display: block; width: fit-content; margin: 0 auto 26px; padding: 6px 30px;
      background: linear-gradient(90deg, transparent, #faf3e2, transparent);
      border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
      font-family: 'Amiri', serif; font-size: 1.5rem; font-weight: bold; color: var(--deep-gold);
    }
    
    .quran-text-container {
      text-align: center; line-height: 2.8; font-family: 'Amiri Quran', 'Amiri', serif;
      font-size: 2.1rem; color: #171513; user-select: none;
    }

    .word-token {
      display: inline-block; margin: 0 4px; padding: 2px 7px; border-radius: 8px;
      cursor: pointer; position: relative; transition: all 0.15s ease-out;
    }
    .word-token:hover { background: #f1ebd8; }
    .word-token.highlight-filter { background-color: #ffe6aa; border-bottom: 2px solid var(--deep-gold); }
    .word-token.dimmed { opacity: 0.25; }
    .word-token.selected { outline: 2px solid var(--deep-gold); background: #fdf1d5; }
    
    /* تأثير التلاوة السلس */
    .word-token.speaking {
      color: var(--speaking-color) !important;
      transform: scale(1.15);
      text-shadow: 0 0 12px var(--glow-color);
      z-index: 10;
    }

    .ayah-marker {
      display: inline-flex; align-items: center; justify-content: center;
      margin: 0 6px; color: var(--deep-gold); font-size: 1.4rem; font-family: 'Amiri', serif;
    }

    /* التلميح */
    .word-tooltip {
      position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
      background: #2b261f; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem;
      white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    }
    .word-token:hover .word-tooltip { opacity: 1; transform: translateX(-50%) translateY(-3px); }

    /* تفاصيل الكلمة */
    .details-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 22px; display: none; margin-bottom: 30px;
    }
    .details-box.active { display: block; animation: fadeIn 0.3s ease; }
    .details-word { font-family: 'Amiri Quran', serif; font-size: 2rem; color: var(--deep-gold); }
    .rule-item { margin-bottom: 10px; padding: 10px 14px; background: #faf8f3; border-right: 4px solid var(--primary-gold); border-radius: 8px; }
    .btn-play-word { 
      background: var(--primary-gold); color: #fff; border: none; padding: 6px 12px; 
      border-radius: 6px; cursor: pointer; font-family: 'Cairo'; margin-top: 10px;
    }

    /* المشغل السفلي الثابت */
    .bottom-player {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid var(--border-color); padding: 16px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05); z-index: 100;
    }
    .player-controls-wrapper { display: flex; align-items: center; gap: 20px; width: 100%; max-width: 600px; justify-content: center; }
    .btn-play-main {
      background: linear-gradient(135deg, var(--primary-gold), var(--deep-gold));
      color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
      cursor: pointer; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4); transition: transform 0.2s;
    }
    .btn-play-main:hover { transform: scale(1.05); }
    
    .progress-container { width: 100%; max-width: 600px; display: flex; align-items: center; gap: 10px; font-size: 0.85rem; font-weight: 600; color: var(--deep-gold); }
    .progress-bar {
      flex: 1; height: 6px; background: #e5dbc7; border-radius: 4px; cursor: pointer; position: relative;
    }
    .progress-fill { height: 100%; background: var(--deep-gold); border-radius: 4px; width: 0%; pointer-events: none; }

    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 200;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      font-size: 1.2rem; font-weight: bold; color: var(--deep-gold); display: none;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div id="loadingOverlay">جاري جلب بيانات المزامنة من Quran.com...</div>

<div class="container">
  <header>
    <h1>سُورَةُ الفَاتِحَةِ</h1>
    <p>تلاوة وتجويد تفاعلي - مزامنة حية عبر واجهة Quran.com API</p>
  </header>

  <div class="controls-panel">
    <div class="settings-row">
      <label for="reciterSelect" style="font-weight:bold; color:var(--deep-gold)">اختر القارئ:</label>
      <!-- IDs correspond to reciters in Quran.com V4 API -->
      <select id="reciterSelect" class="reciter-select" onchange="changeReciter(this.value)">
        <option value="7" selected>الشيخ مشاري راشد العفاسي</option>
        <option value="12">الشيخ محمود خليل الحصري</option>
        <option value="2">الشيخ عبد الباسط عبد الصمد</option>
        <option value="4">الشيخ أبو بكر الشاطري</option>
      </select>
    </div>

    <div class="filter-buttons-grid">
      <button class="btn-rule active" onclick="filterByRule('all', this)">كل الأحكام</button>
      <button class="btn-rule" onclick="filterByRule('hamas', this)">الهمس</button>
      <button class="btn-rule" onclick="filterByRule('tafkheem', this)">التفخيم</button>
      <button class="btn-rule" onclick="filterByRule('madd_tabiee', this)">المد الطبيعي</button>
      <button class="btn-rule" onclick="filterByRule('madd_ared', this)">المد العارض</button>
      <button class="btn-rule" onclick="filterByRule('lam_shamsiya', this)">اللام الشمسية</button>
    </div>

    <div class="rule-brief-card" id="ruleBriefCard">
      <div class="rule-brief-title" id="ruleBriefTitle"></div>
      <div class="rule-brief-desc" id="ruleBriefDesc"></div>
    </div>
  </div>

  <main class="mushaf-card">
    <div class="surah-header-badge">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ</div>
    <div class="quran-text-container" id="quranContainer"></div>
  </main>

  <section class="details-box" id="detailsBox">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #ebd9b5; padding-bottom:12px; margin-bottom:16px;">
      <div class="details-word" id="detailWordText">-</div>
      <button class="btn-play-word" onclick="playFromSelectedWord()">▶ استمع من هنا</button>
    </div>
    <div id="detailRulesList"></div>
  </section>
</div>

<!-- المشغل السفلي -->
<div class="bottom-player">
  <div class="progress-container">
    <span id="timeCurrent">0:00</span>
    <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span id="timeTotal">0:00</span>
  </div>
  <div class="player-controls-wrapper">
    <button class="btn-play-main" id="playBtnMain" onclick="toggleAudio()">▶</button>
  </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
  const RULE_INFO = {
    hamas: { title: "الهمس", desc: "جريان النَّفَس عند النطق بالحرف لضعف الاعتماد على مخرجه." },
    tafkheem: { title: "التفخيم", desc: "تسمين الحرف وتغليظه حتى يمتلئ الفم بصداه." },
    madd_tabiee: { title: "المد الطبيعي", desc: "المد الذي لا تقوم ذات حرف المد إلا به ومقداره حركتان." },
    madd_ared: { title: "المد العارض للسكون", desc: "مد الحرف قبل الأخير عند الوقف (2 أو 4 أو 6 حركات)." },
    lam_shamsiya: { title: "اللام الشمسية", desc: "إدغام لام (أل) التعريف في الحرف الذي يليها فتختفي نطقاً وتشدد الحرف." }
  };

  // بيانات الآيات بدون توقيت (التوقيت سيُجلب من الـ API)
  let quranData = [
    { id: 1, text: "بِسۡمِ", rules: [{name: "ترقيق", cat: "tarqeeq", text: "ترقيق الباء والسين والميم."}] },
    { id: 2, text: "ٱللَّهِ", rules: [{name: "ترقيق", cat: "tarqeeq", text: "ترقيق اللام لكسر ما قبلها."}] },
    { id: 3, text: "ٱلرَّحۡمَٰنِ", rules: [{name: "لام شمسية", cat: "lam_shamsiya", text: "إدغام اللام في الراء."}] },
    { id: 4, text: "ٱلرَّحِيمِ", rules: [{name: "مد عارض للسكون", cat: "madd_ared", text: "مد عارض للسكون عند الوقف."}] },
    { isAyahEnd: true, num: 1 },
    { id: 5, text: "ٱلۡحَمۡدُ", rules: [] },
    { id: 6, text: "لِلَّهِ", rules: [] },
    { id: 7, text: "رَبِّ", rules: [{name: "تفخيم الراء", cat: "tafkheem", text: "تفخيم الراء المفتوحة."}] },
    { id: 8, text: "ٱلۡعَٰلَمِينَ", rules: [{name: "مد عارض", cat: "madd_ared", text: "مد عارض للسكون."}] },
    { isAyahEnd: true, num: 2 },
    { id: 9, text: "ٱلرَّحۡمَٰنِ", rules: [{name: "لام شمسية", cat: "lam_shamsiya", text: "إدغام اللام."}] },
    { id: 10, text: "ٱلرَّحِيمِ", rules: [{name: "مد عارض", cat: "madd_ared", text: "مد عارض للسكون."}] },
    { isAyahEnd: true, num: 3 },
    { id: 11, text: "مَٰلِكِ", rules: [{name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف حركتين."}] },
    { id: 12, text: "يَوۡمِ", rules: [] },
    { id: 13, text: "ٱلدِّينِ", rules: [{name: "لام شمسية", cat: "lam_shamsiya", text: "إدغام اللام."}] },
    { isAyahEnd: true, num: 4 },
    { id: 14, text: "إِيَّاكَ", rules: [{name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف."}] },
    { id: 15, text: "نَعۡبُدُ", rules: [] },
    { id: 16, text: "وَإِيَّاكَ", rules: [{name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف."}] },
    { id: 17, text: "نَسۡتَعِينُ", rules: [{name: "مد عارض", cat: "madd_ared", text: "مد عارض للسكون."}] },
    { isAyahEnd: true, num: 5 },
    { id: 18, text: "ٱهۡدِنَا", rules: [{name: "همس", cat: "hamas", text: "همس الهاء الساكنة."}] },
    { id: 19, text: "ٱلصِّرَٰطَ", rules: [{name: "تفخيم", cat: "tafkheem", text: "تفخيم الصاد والطاء."}] },
    { id: 20, text: "ٱلۡمُسۡتَقِيمَ", rules: [{name: "همس", cat: "hamas", text: "همس السين والتاء."}] },
    { isAyahEnd: true, num: 6 },
    { id: 21, text: "صِرَٰطَ", rules: [{name: "تفخيم", cat: "tafkheem", text: "تفخيم الصاد والطاء."}] },
    { id: 22, text: "ٱلَّذِينَ", rules: [] },
    { id: 23, text: "أَنۡعَمۡتَ", rules: [] },
    { id: 24, text: "عَلَيۡهِمۡ", rules: [] },
    { id: 25, text: "غَيۡرِ", rules: [{name: "تفخيم", cat: "tafkheem", text: "تفخيم الغين."}] },
    { id: 26, text: "ٱلۡمَغۡضُوبِ", rules: [{name: "تفخيم", cat: "tafkheem", text: "تفخيم الضاد."}] },
    { id: 27, text: "عَلَيۡهِمۡ", rules: [] },
    { id: 28, text: "وَلَا", rules: [{name: "مد طبيعي", cat: "madd_tabiee", text: "مد الألف."}] },
    { id: 29, text: "ٱلضَّآلِّينَ", rules: [{name: "مد لازم", cat: "madd_lazim", text: "مد لازم كلمي مثقل 6 حركات."}] },
    { isAyahEnd: true, num: 7 }
  ];

  const audio = document.getElementById('audioPlayer');
  const playBtnMain = document.getElementById('playBtnMain');
  const quranContainer = document.getElementById('quranContainer');
  let animationFrameId;
  let activeWordId = null;
  let selectedWordId = null;

  // تهيئة واجهة المصحف
  function renderMushaf() {
    quranContainer.innerHTML = '';
    quranData.forEach(item => {
      if (item.isAyahEnd) {
        const marker = document.createElement('span');
        marker.className = 'ayah-marker';
        marker.innerHTML = `﴿${item.num}﴾`;
        quranContainer.appendChild(marker);
      } else {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.id = `word-${item.id}`;
        span.textContent = item.text;
        
        if (item.rules && item.rules.length > 0) {
          span.dataset.categories = item.rules.map(r => r.cat).join(' ');
          const tooltip = document.createElement('div');
          tooltip.className = 'word-tooltip';
          tooltip.textContent = item.rules.map(r => r.name).join(' • ');
          span.appendChild(tooltip);
        } else {
          span.dataset.categories = "";
        }

        span.addEventListener('click', () => selectWord(item));
        quranContainer.appendChild(span);
      }
    });
  }

  // جلب البيانات من Quran.com V4 API
  async function changeReciter(reciterId) {
    document.getElementById('loadingOverlay').style.display = 'flex';
    audio.pause();
    playBtnMain.textContent = '▶';
    
    try {
      // 1. جلب التوقيتات بالكلمة
      const timeRes = await fetch(`https://api.quran.com/api/v4/quran/verses/audio?chapter_id=1&reciter_id=${reciterId}`);
      const timeData = await timeRes.json();
      
      // 2. جلب رابط الملف الصوتي
      const audioRes = await fetch(`https://api.quran.com/api/v4/chapter_recitations/${reciterId}/1`);
      const audioData = await audioRes.json();
      
      audio.src = audioData.audio_file.audio_url;

      // 3. دمج التوقيتات (API يعيد أوقات الكلمات بالمللي ثانية، نحولها لثواني)
      let wordCounter = 1;
      timeData.verses.forEach(verse => {
        if(verse.words) {
          verse.words.forEach(w => {
            const currentItem = quranData.find(d => d.id === wordCounter);
            if (currentItem && w.start_time !== undefined) {
              currentItem.start = w.start_time / 1000;
              currentItem.end = w.end_time / 1000;
              wordCounter++;
            }
          });
        }
      });

      document.getElementById('loadingOverlay').style.display = 'none';
      renderMushaf();

    } catch (err) {
      alert("حدث خطأ أثناء جلب البيانات من واجهة Quran.com");
      document.getElementById('loadingOverlay').style.display = 'none';
    }
  }

  // المزامنة الحية باستخدام requestAnimationFrame للحصول على نعومة فائقة
  function syncHighlighting() {
    const current = audio.currentTime;
    
    // شريط التقدم
    if (audio.duration) {
      const percentage = (current / audio.duration) * 100;
      document.getElementById('progressFill').style.width = percentage + '%';
      document.getElementById('timeCurrent').textContent = formatTime(current);
    }

    const currentWord = quranData.find(item => !item.isAyahEnd && item.start !== undefined && current >= item.start && current < item.end);

    if (currentWord) {
      if (activeWordId !== currentWord.id) {
        clearSpeakingHighlight();
        activeWordId = currentWord.id;
        const elem = document.getElementById(`word-${currentWord.id}`);
        if (elem) elem.classList.add('speaking');
      }
    } else {
      clearSpeakingHighlight();
      activeWordId = null;
    }

    if (!audio.paused) {
      animationFrameId = requestAnimationFrame(syncHighlighting);
    }
  }

  function toggleAudio() {
    if (audio.paused) {
      audio.play();
      playBtnMain.textContent = '⏸';
      animationFrameId = requestAnimationFrame(syncHighlighting);
    } else {
      audio.pause();
      playBtnMain.textContent = '▶';
      cancelAnimationFrame(animationFrameId);
    }
  }

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('timeTotal').textContent = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    playBtnMain.textContent = '▶';
    clearSpeakingHighlight();
    cancelAnimationFrame(animationFrameId);
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('timeCurrent').textContent = '0:00';
  });

  function clearSpeakingHighlight() {
    document.querySelectorAll('.word-token.speaking').forEach(w => w.classList.remove('speaking'));
  }

  function selectWord(item) {
    document.querySelectorAll('.word-token').forEach(w => w.classList.remove('selected'));
    const wordElem = document.getElementById(`word-${item.id}`);
    if (wordElem) wordElem.classList.add('selected');
    
    selectedWordId = item.id;
    const detailsBox = document.getElementById('detailsBox');
    document.getElementById('detailWordText').textContent = item.text;
    
    const rulesList = document.getElementById('detailRulesList');
    rulesList.innerHTML = '';
    
    if(item.rules && item.rules.length > 0) {
      item.rules.forEach(rule => {
        rulesList.innerHTML += `<div class="rule-item"><strong>${rule.name}</strong><br>${rule.text}</div>`;
      });
    } else {
      rulesList.innerHTML = '<div class="rule-item" style="border-right-color:#ccc; color:#666;">لا توجد أحكام تجويدية مسجلة لهذه الكلمة.</div>';
    }

    detailsBox.classList.add('active');
  }

  function playFromSelectedWord() {
    const item = quranData.find(d => d.id === selectedWordId);
    if (item && item.start !== undefined) {
      audio.currentTime = item.start;
      if (audio.paused) toggleAudio();
    }
  }

  function filterByRule(category, btnElement) {
    document.querySelectorAll('.btn-rule').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    const briefCard = document.getElementById('ruleBriefCard');
    if (category === 'all') {
      briefCard.classList.remove('active');
      document.querySelectorAll('.word-token').forEach(w => w.classList.remove('highlight-filter', 'dimmed'));
      return;
    }

    if (RULE_INFO[category]) {
      document.getElementById('ruleBriefTitle').textContent = RULE_INFO[category].title;
      document.getElementById('ruleBriefDesc').textContent = RULE_INFO[category].desc;
      briefCard.classList.add('active');
    }

    document.querySelectorAll('.word-token').forEach(w => {
      const cats = (w.dataset.categories || "").split(' ');
      if (cats.includes(category)) {
        w.classList.add('highlight-filter');
        w.classList.remove('dimmed');
      } else {
        w.classList.remove('highlight-filter');
        w.classList.add('dimmed');
      }
    });
  }

  function seekAudio(e) {
    const bar = document.getElementById('progressBar');
    const percent = e.offsetX / bar.offsetWidth;
    if (audio.duration) {
      audio.currentTime = percent * audio.duration;
      syncHighlighting();
    }
  }

  function formatTime(secs) {
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return `${m}:${s < 10 ? '0'+s : s}`;
  }

  // التهيئة الأولى (العفاسي)
  renderMushaf();
  changeReciter(7);

</script>
</body>
</html>
